[Definition]
# Caddy JSON access log: ban repeated 401 responses for management routes.
# client_ip (not remote_ip): nginx fronts Caddy and the real client arrives
# via X-Forwarded-For, which Caddy derives into client_ip (trusted_proxies).
failregex = ^\{.*"client_ip":"<HOST>".*"uri":"/(?:admin|api)(?:/[^"?]*)?(?:\?[^\"]*)?".*"status":401(?:,|\}).*$
# Caddy logs a float epoch in "ts"; the named Epoch template parses it.
datepattern = Epoch
ignoreregex =
