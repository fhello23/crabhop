[Definition]
# Caddy JSON access log: ban repeated authentication failures. Match status,
# not the raw URI: Caddy also authenticates URL-encoded management paths,
# and the logging policy redacts those paths to protect shared links.
# client_ip (not remote_ip): nginx fronts Caddy and the real client arrives
# via X-Forwarded-For, which Caddy derives into client_ip (trusted_proxies).
failregex = ^\{.*"client_ip":"<HOST>".*"status":401(?:,|\}).*$
# Caddy logs a float epoch inside the JSON "ts" field.
datepattern = "ts":{EPOCH}
ignoreregex =
