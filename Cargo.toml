[package]
name = "shortener"
version = "0.1.0"
edition = "2021"
description = "Single-administrator link shortener (Axum + SQLite)"
license = "MIT"

[[bin]]
name = "shortener"
path = "src/main.rs"

[lib]
name = "shortener"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "migrate", "macros", "runtime-tokio"] }
askama = { version = "0.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"
rand = "0.9"
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
hmac = "0.12"
sha2 = "0.11"
base64 = "0.22"
subtle = "2"
dotenvy = "0.15"
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
strip = true
