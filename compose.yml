x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  shortener:
    build: .
    image: go-shortener:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_BIND: "0.0.0.0:3000"
    volumes:
      - app-data:/data
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/shortener-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    user: "10001"
    logging: *container-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_HOST:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_HOST:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    env_file:
      - ${APP_ENV_FILE:-.env}
    networks:
      - internal
    depends_on:
      shortener:
        condition: service_healthy
    logging: *container-logging

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
  caddy-logs:
